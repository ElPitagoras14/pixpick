services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # A single mount at /var/lib/postgresql, not .../data: the postgres 18+
    # image lays out its major-version-specific data directory underneath
    # this path (pg_ctlcluster-style) and refuses to start otherwise.
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - pixpick

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
    networks:
      - pixpick

  frontend:
    build:
      context: ./frontend
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      API_BASE_URL: ${API_BASE_URL}
    networks:
      - pixpick

  # The single door to the host. No other service in this file publishes a
  # port: the platform's own proxy reaches them over this network instead
  # (D7). compose.dev.yaml is what opens ports on a developer's machine.
  edge:
    build:
      context: ./edge
    networks:
      - pixpick

networks:
  pixpick:

volumes:
  postgres-data:
