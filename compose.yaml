# Pulls the project's four images by tag and publishes no port: the
# platform's proxy reaches them over this network. Complete on its own,
# never combined with compose.dev.yaml. Every service declares a memory
# ceiling and a restart policy, because they share one machine. No workflow
# publishes these tags yet, so this file cannot start those four.
services:
  postgres:
    mem_limit: 512m
    restart: unless-stopped
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # `up`, not `migrate`: the database may not exist the first time, and `up`
  # creates it before migrating.
  pixpick-migrate:
    mem_limit: 256m
    restart: "no"
    image: ghcr.io/elpitagoras14/pixpick-migrate:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    command: ["--no-dump-schema", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pixpick

  pixpick-backend:
    mem_limit: 512m
    restart: unless-stopped
    image: ghcr.io/elpitagoras14/pixpick-backend:latest
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # Fed STORAGE_PUBLIC_URL, not the variable of the same name: in
      # containers the browser writes through nginx's own storage hostname.
      MINIO_BROWSER_ENDPOINT: ${STORAGE_PUBLIC_URL}
      MINIO_SERVER_ENDPOINT: http://storage:9000
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER}
      IMAGE_SIGNING_KEY: ${IMAGE_SIGNING_KEY}
      IMAGE_SIGNING_SALT: ${IMAGE_SIGNING_SALT}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
      ALBUM_MAX_PHOTOS: ${ALBUM_MAX_PHOTOS}
      ACCOUNT_MAX_BYTES: ${ACCOUNT_MAX_BYTES}
      INSTANCE_MAX_BYTES: ${INSTANCE_MAX_BYTES}
      ALBUM_RETENTION_DAYS: ${ALBUM_RETENTION_DAYS}
    depends_on:
      pixpick-migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    networks:
      - pixpick

  # The storage, the database and the cache share one disk here, so what
  # this discards is what keeps that disk from filling up.
  reconciler:
    mem_limit: 256m
    restart: unless-stopped
    image: ghcr.io/elpitagoras14/pixpick-backend:latest
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          python -m src.maintenance.reconcile
          sleep 300
        done
    environment:
      # Only what src/maintenance/reconcile.py's import graph reaches.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_BROWSER_ENDPOINT: ${STORAGE_PUBLIC_URL}
      MINIO_SERVER_ENDPOINT: http://storage:9000
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      ALBUM_RETENTION_DAYS: ${ALBUM_RETENTION_DAYS}
    depends_on:
      pixpick-migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    networks:
      - pixpick

  pixpick-frontend:
    mem_limit: 128m
    restart: unless-stopped
    image: ghcr.io/elpitagoras14/pixpick-frontend:latest
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      API_BASE_URL: ${API_BASE_URL}
    networks:
      - pixpick

  # Declared whether or not STORAGE_PROVIDER names it: that variable decides
  # which provider the application talks to, never which containers run.
  storage:
    mem_limit: 512m
    restart: unless-stopped
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_ALLOWED_ORIGINS}
      # Explicit, not whatever a given MinIO version defaults to.
      MINIO_BROWSER: "off"
    command: ["server", "/data"]
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # It reads originals from the storage itself: nothing here ever hands it
  # bytes. Declared whether or not IMAGE_PROVIDER names it, like `storage`.
  transformer:
    mem_limit: 512m
    restart: unless-stopped
    image: darthsim/imgproxy:v4.0.14
    environment:
      IMGPROXY_KEY: ${IMAGE_SIGNING_KEY}
      IMGPROXY_SALT: ${IMAGE_SIGNING_SALT}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://storage:9000
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      # A signed address is valid for any object in the storage, not only the
      # ones this project's catalog requests, and each costs real CPU.
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
      IMGPROXY_MAX_SRC_FILE_SIZE: "20971520"
      # A ceiling over the catalog's largest variant
      # (backend/src/images/catalog.py), not a copy of it: an entry that
      # outgrows this fails loudly instead of serving something bigger.
      IMGPROXY_MAX_RESULT_DIMENSION: "2048"
      IMGPROXY_WORKERS_NUMBER: "2"
      IMGPROXY_DOWNLOAD_TIMEOUT: "10"
      # A signature covers the object identity and content type, never the
      # prefix, so this is what keeps a signed address inside albums/.
      IMGPROXY_ALLOWED_SOURCES: s3://${MINIO_BUCKET}/albums/*
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - pixpick

  pixpick-nginx:
    mem_limit: 128m
    restart: unless-stopped
    image: ghcr.io/elpitagoras14/pixpick-nginx:latest
    environment:
      # nginx/entrypoint.sh derives its storage server block's hostname from
      # this. The same value the backend gets as MINIO_BROWSER_ENDPOINT, so
      # the two can never differ.
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
    volumes:
      - nginx-cache:/var/cache/nginx/images
    networks:
      - pixpick

# A fixed subnet, not Docker's dynamic allocation: nginx and the backend
# trust exactly the range below to declare a client's address. `gateway`
# sits outside `ip_range`, because a connection from outside arrives as the
# gateway and trusting it would trust anything that reaches the host. The
# same literals are in nginx/nginx.conf.template and backend/src/main.py.
networks:
  pixpick:
    ipam:
      config:
        - subnet: 172.30.238.0/24
          ip_range: 172.30.238.128/25
          gateway: 172.30.238.1

volumes:
  postgres-data:
  storage-data:
  nginx-cache:
