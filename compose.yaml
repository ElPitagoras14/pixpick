# This file's own four images (migrate, backend, frontend, nginx) are
# each declared with `image: ghcr.io/...`, not `build:` -- this is the
# file a deployment pulls published images with, never one that builds
# from source. compose.dev.yaml is where `build:` lives for each of the
# four, overriding the image declared here for local development; add
# `--build` to `docker compose up` after a source change so the override
# actually rebuilds instead of reusing a stale local image.
#
# No workflow publishes these tags to GHCR yet -- `ghcr.io/elpitagoras14/
# pixpick-*:latest` doesn't exist there today, so this file alone (without
# compose.dev.yaml's own `build:` override) can't start any of the four
# until one does.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # A single mount at /var/lib/postgresql, not .../data: the postgres 18+
    # image lays out its major-version-specific data directory underneath
    # this path (pg_ctlcluster-style) and refuses to start otherwise.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # Runs once, applies pending migrations, and exits (D6). Its connection
  # string is assembled here from the same Postgres server values instead of
  # being written by hand (D7). Bakes the pinned dbmate version and the
  # project's migrations into its image -- see dbmate/Dockerfile. `up`, not
  # `migrate`: the database the connection string names may not exist yet
  # the first time it is used, and `up` creates it before migrating --
  # a no-op every other time.
  migrate:
    image: ghcr.io/elpitagoras14/pixpick-migrate:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    command: ["--no-dump-schema", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pixpick

  backend:
    image: ghcr.io/elpitagoras14/pixpick-backend:latest
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_BROWSER_ENDPOINT: ${MINIO_BROWSER_ENDPOINT}
      # Composed here, never taken from .env: this is the address the
      # services reach each other by inside this network.
      MINIO_SERVER_ENDPOINT: http://storage:9000
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER}
      IMAGE_SIGNING_KEY: ${IMAGE_SIGNING_KEY}
      IMAGE_SIGNING_SALT: ${IMAGE_SIGNING_SALT}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
      ALBUM_MAX_PHOTOS: ${ALBUM_MAX_PHOTOS}
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Only present in the local profile (D1 in add-cloud-media-adapters):
      # `required: false` means this is simply skipped, not an error, when
      # the cloud profile leaves it out of the resolved project entirely.
      storage:
        condition: service_healthy
        required: false
    networks:
      - pixpick

  frontend:
    image: ghcr.io/elpitagoras14/pixpick-frontend:latest
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      API_BASE_URL: ${API_BASE_URL}
    networks:
      - pixpick

  # The object storage. The browser writes to it directly (D3 in
  # add-media-ports-and-local-adapters), so unlike every other service in
  # this file it is meant to be reached from outside the Docker network too
  # -- compose.dev.yaml is what publishes its port. Only started in the
  # local profile (D1 in add-cloud-media-adapters): a cloud STORAGE_PROVIDER
  # needs none of this, its bucket already exists at the provider.
  storage:
    profiles: ["local"]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
      # Declared on the server, not on the bucket: MinIO has no working
      # per-bucket CORS API -- PutBucketCors always answers NotImplemented
      # -- and with a single bucket the two are equally precise anyway
      # (D3, D9 in add-media-ports-and-local-adapters).
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_ALLOWED_ORIGINS}
    command: ["server", "/data"]
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # The image transformer. It reads originals from the storage by itself
  # (D2): nothing in this project ever hands it bytes. It publishes no port
  # -- nginx is the only way to reach it (D5), unlike the storage above.
  # Local profile only, same reason as `storage`: nginx's own /images route
  # resolves this hostname per-request (nginx.conf), never at startup, so
  # its absence in the cloud profile is never an error (D5 in
  # add-media-ports-and-local-adapters, unchanged by this).
  transformer:
    profiles: ["local"]
    image: darthsim/imgproxy:v4.0.14
    environment:
      IMGPROXY_KEY: ${IMAGE_SIGNING_KEY}
      IMGPROXY_SALT: ${IMAGE_SIGNING_SALT}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://storage:9000
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - pixpick

  # The single door to the host: routes to the backend, the transformer, and
  # the frontend. No other service in this file publishes a port: the
  # platform's own proxy reaches them over this network instead (D7).
  # compose.dev.yaml is what opens ports on a developer's machine.
  nginx:
    image: ghcr.io/elpitagoras14/pixpick-nginx:latest
    volumes:
      # The images cache (D12 in add-media-ports-and-local-adapters): a
      # volume, not an anonymous layer, so it survives a container
      # restart instead of re-warming from nothing every time.
      - nginx-cache:/var/cache/nginx/images
    networks:
      - pixpick

networks:
  pixpick:

volumes:
  postgres-data:
  storage-data:
  nginx-cache:
