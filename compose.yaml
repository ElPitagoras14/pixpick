services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # A single mount at /var/lib/postgresql, not .../data: the postgres 18+
    # image lays out its major-version-specific data directory underneath
    # this path (pg_ctlcluster-style) and refuses to start otherwise.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # Runs once, applies pending migrations, and exits (D6). Its connection
  # string is assembled here from the same Postgres server values instead of
  # being written by hand (D7). Bakes the pinned dbmate version and the
  # project's migrations into its image -- see dbmate/Dockerfile.
  migrate:
    build:
      context: ./dbmate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    command: ["--no-dump-schema", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pixpick

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - pixpick

  frontend:
    build:
      context: ./frontend
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      API_BASE_URL: ${API_BASE_URL}
    networks:
      - pixpick

  # The single door to the host. No other service in this file publishes a
  # port: the platform's own proxy reaches them over this network instead
  # (D7). compose.dev.yaml is what opens ports on a developer's machine.
  edge:
    build:
      context: ./edge
    networks:
      - pixpick

networks:
  pixpick:

volumes:
  postgres-data:
