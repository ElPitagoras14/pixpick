# This file's own four images (migrate, backend, frontend, nginx) are
# each declared with `image: ghcr.io/...`, not `build:` -- this is the
# file a deployment pulls published images with, never one that builds
# from source. compose.dev.yaml is where `build:` lives for each of the
# four, overriding the image declared here for local development; add
# `--build` to `docker compose up` after a source change so the override
# actually rebuilds instead of reusing a stale local image.
#
# No workflow publishes these tags to GHCR yet -- `ghcr.io/elpitagoras14/
# pixpick-*:latest` doesn't exist there today, so this file alone (without
# compose.dev.yaml's own `build:` override) can't start any of the four
# until one does.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # A single mount at /var/lib/postgresql, not .../data: the postgres 18+
    # image lays out its major-version-specific data directory underneath
    # this path (pg_ctlcluster-style) and refuses to start otherwise.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # Runs once, applies pending migrations, and exits (D6). Its connection
  # string is assembled here from the same Postgres server values instead of
  # being written by hand (D7). Bakes the pinned dbmate version and the
  # project's migrations into its image -- see dbmate/Dockerfile.
  migrate:
    image: ghcr.io/elpitagoras14/pixpick-migrate:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    command: ["--no-dump-schema", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pixpick

  backend:
    image: ghcr.io/elpitagoras14/pixpick-backend:latest
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER}
      PUBLIC_URL: ${PUBLIC_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_BROWSER_ENDPOINT: ${STORAGE_BROWSER_ENDPOINT}
      # Containers mode reaches the storage by its service name; the native
      # default in .env.example is the host-published port instead (D4).
      STORAGE_SERVER_ENDPOINT: http://storage:9000
      STORAGE_ROOT_USER: ${STORAGE_ROOT_USER}
      STORAGE_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER}
      IMAGE_SIGNING_KEY: ${IMAGE_SIGNING_KEY}
      IMAGE_SIGNING_SALT: ${IMAGE_SIGNING_SALT}
      ALBUM_MAX_PHOTOS: ${ALBUM_MAX_PHOTOS}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    networks:
      - pixpick

  frontend:
    image: ghcr.io/elpitagoras14/pixpick-frontend:latest
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      API_BASE_URL: ${API_BASE_URL}
    networks:
      - pixpick

  # The object storage. The browser writes to it directly (D3 in
  # add-media-ports-and-local-adapters), so unlike every other service in
  # this file it is meant to be reached from outside the Docker network too
  # -- compose.dev.yaml is what publishes its port.
  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD}
      # MinIO has no per-bucket CORS API -- PutBucketCors is a permanent
      # no-op on its server (verified against its source: every bucket-CORS
      # handler always answers NotImplemented). Origins are declared here
      # instead, server-wide, which is exactly as precise as a per-bucket
      # policy given this project has a single bucket (D3, D9 in
      # add-media-ports-and-local-adapters).
      MINIO_API_CORS_ALLOW_ORIGIN: ${STORAGE_ALLOWED_ORIGINS}
    command: ["server", "/data"]
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # Runs once against the storage and exits: creates its bucket, so a
  # clean clone needs no manual step -- the same guarantee `migrate` gives
  # for the schema.
  storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      STORAGE_SERVER_ENDPOINT: http://storage:9000
      STORAGE_ROOT_USER: ${STORAGE_ROOT_USER}
      STORAGE_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    volumes:
      - ./storage/init.sh:/init/init.sh:ro
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - pixpick

  # The image transformer. It reads originals from the storage by itself
  # (D2): nothing in this project ever hands it bytes. It publishes no port
  # -- nginx is the only way to reach it (D5), unlike the storage above.
  transformer:
    image: darthsim/imgproxy:v4.0.14
    environment:
      IMGPROXY_KEY: ${IMAGE_SIGNING_KEY}
      IMGPROXY_SALT: ${IMAGE_SIGNING_SALT}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://storage:9000
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${STORAGE_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_ROOT_PASSWORD}
    depends_on:
      storage-init:
        condition: service_completed_successfully
    networks:
      - pixpick

  # The single door to the host: routes to the backend, the transformer, and
  # the frontend. No other service in this file publishes a port: the
  # platform's own proxy reaches them over this network instead (D7).
  # compose.dev.yaml is what opens ports on a developer's machine.
  nginx:
    image: ghcr.io/elpitagoras14/pixpick-nginx:latest
    volumes:
      # The images cache (D12 in add-media-ports-and-local-adapters): a
      # volume, not an anonymous layer, so it survives a container
      # restart instead of re-warming from nothing every time.
      - nginx-cache:/var/cache/nginx/images
    networks:
      - pixpick

networks:
  pixpick:

volumes:
  postgres-data:
  storage-data:
  nginx-cache:
