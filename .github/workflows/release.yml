name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/elpitagoras14/pixpick

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: version
        name: Compare the declared version against the published one
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          previous="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -z "$previous" ]; then
            release=true
          elif [ "$version" = "$previous" ]; then
            release=false
          elif [ "$(printf '%s\n%s\n' "$version" "$previous" | sort -V | tail -n 1)" = "$version" ]; then
            release=true
          else
            release=false
          fi
          {
            echo "version=$version"
            echo "previous=$previous"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "declared $version, published ${previous:-none}, release $release"

  publish:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            context: backend
            paths: backend :!backend/tests
            cache: true
          - service: frontend
            context: frontend
            paths: frontend :!frontend/AGENTS.md :!frontend/biome.json :!frontend/.cta.json
            cache: true
          - service: migrate
            context: dbmate
            paths: dbmate
            cache: false
          - service: nginx
            context: nginx
            paths: nginx
            cache: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: decide
        name: Decide between building and reusing
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          PATHS: ${{ matrix.paths }}
          PREVIOUS: ${{ needs.detect.outputs.previous }}
        run: |
          build=true
          if [ -n "$PREVIOUS" ] && docker buildx imagetools inspect "$IMAGE:$PREVIOUS" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            if git diff --quiet "$PREVIOUS" HEAD -- $PATHS; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "$IMAGE: build=$build"

      - uses: docker/setup-qemu-action@v3
        if: steps.decide.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.decide.outputs.build == 'true'

      - uses: docker/build-push-action@v6
        if: steps.decide.outputs.build == 'true'
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ needs.detect.outputs.version }}
          cache-from: ${{ matrix.cache && format('type=registry,ref={0}-{1}:buildcache', env.IMAGE_PREFIX, matrix.service) || '' }}
          cache-to: ${{ matrix.cache && format('type=registry,ref={0}-{1}:buildcache,mode=max', env.IMAGE_PREFIX, matrix.service) || '' }}

      - name: Reuse the image from the previous release
        if: steps.decide.outputs.build == 'false'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          VERSION: ${{ needs.detect.outputs.version }}
          PREVIOUS: ${{ needs.detect.outputs.previous }}
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$PREVIOUS"

  promote:
    needs: [detect, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at the version just published
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          for service in backend frontend migrate nginx; do
            image="$IMAGE_PREFIX-$service"
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done

  record:
    needs: [detect, promote]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag the commit and record the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes

  deploy:
    needs: [detect, record]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Tell Dokploy to take the new version
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          key="$(printf '%s' "$DOKPLOY_API_KEY" | tr -d '[:space:]')"
          curl --fail-with-body -sS -X POST https://dokploy.pitagoraslab.qzz.io/api/compose.deploy \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: $key" \
            -d "$(printf '{"composeId":"%s","title":"Release %s","description":"Triggered by the release workflow"}' "$DOKPLOY_COMPOSE_ID" "$VERSION")"
