services:
  # Builds from source instead of the `image:` compose.yaml declares (its
  # own top comment has the reasoning) -- add `--build` to `docker compose
  # up` after a source change, or a stale local image serves instead.
  nginx:
    build:
      context: ./nginx
    ports:
      - "${NGINX_PORT}:80"

  # Published only so a database client on the host can inspect it (D7);
  # nothing in this change connects to it yet.
  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB

  # Published because the browser writes to it directly (D3, D4); the
  # transformer is not published, it is only ever reached through nginx.
  storage:
    ports:
      - "${MINIO_PORT}:9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_ACCESS_KEY}
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_ALLOWED_ORIGINS}

  transformer:
    environment:
      - IMGPROXY_KEY=${IMAGE_SIGNING_KEY}
      - IMGPROXY_SALT=${IMAGE_SIGNING_SALT}
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY}

  migrate:
    build:
      context: ./dbmate

  backend:
    build:
      context: ./backend
    environment:
      - ENVIRONMENT
      - IDENTITY_PROVIDER
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - PUBLIC_URL
      - STORAGE_PROVIDER
      - MINIO_ACCESS_KEY_ID
      - MINIO_SECRET_ACCESS_KEY
      - MINIO_BUCKET
      - MINIO_BROWSER_ENDPOINT
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_BUCKET
      - R2_ENDPOINT
      - IMAGE_PROVIDER
      - IMAGE_SIGNING_KEY
      - IMAGE_SIGNING_SALT
      - IMAGEKIT_URL_ENDPOINT
      - IMAGEKIT_PRIVATE_KEY
      - ALBUM_MAX_PHOTOS

  frontend:
    build:
      context: ./frontend
    environment:
      - ENVIRONMENT
      - API_BASE_URL
