services:
  nginx:
    ports:
      - "${NGINX_PORT}:80"

  # Published only so a database client on the host can inspect it (D7);
  # nothing in this change connects to it yet.
  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"

  # Published because the browser writes to it directly (D3, D4); the
  # transformer is not published, it is only ever reached through nginx.
  storage:
    ports:
      - "${STORAGE_PORT}:9000"

  # No dev-only override: the backend builds from its Dockerfile the same
  # way in every environment for now. Rebuild the image to pick up a code
  # change (`docker compose ... up --build backend`). A later change is
  # what's expected to make compose.yaml pull a published image instead,
  # at which point this file would be where the local build lives.
