services:
  edge:
    ports:
      - "${EDGE_PORT}:80"

  # Published only so a database client on the host can inspect it (D7);
  # nothing in this change connects to it yet.
  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"

  # Source mounted over the image's copy, and `fastapi dev` (autoreload)
  # instead of the Dockerfile's `fastapi run`, so editing backend code
  # doesn't require rebuilding the image.
  backend:
    volumes:
      - ./backend/src:/app/src
    command: ["fastapi", "dev", "src/main.py", "--host", "0.0.0.0", "--port", "8000"]
