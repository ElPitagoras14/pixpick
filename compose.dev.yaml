# Builds the project's four images from source and publishes the ports a
# developer needs. Complete on its own, never combined with compose.yaml,
# its published-images twin: the two differ only in where each image comes
# from and which ports are open. Every service declares a memory ceiling
# and a restart policy, because they share one machine.
services:
  postgres:
    mem_limit: 512m
    restart: unless-stopped
    image: postgres:18.6
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # `up`, not `migrate`: the database may not exist the first time, and `up`
  # creates it before migrating.
  migrate:
    mem_limit: 256m
    restart: "no"
    build:
      context: ./dbmate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    command: ["up"]
    volumes:
      - ./dbmate:/db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pixpick

  backend:
    mem_limit: 512m
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_BROWSER_ENDPOINT: ${STORAGE_PUBLIC_URL}
      MINIO_SERVER_ENDPOINT: http://storage:9000
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER}
      IMAGE_SIGNING_KEY: ${IMAGE_SIGNING_KEY}
      IMAGE_SIGNING_SALT: ${IMAGE_SIGNING_SALT}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
      ALBUM_MAX_PHOTOS: ${ALBUM_MAX_PHOTOS}
      ACCOUNT_MAX_BYTES: ${ACCOUNT_MAX_BYTES}
      INSTANCE_MAX_BYTES: ${INSTANCE_MAX_BYTES}
      ALBUM_RETENTION_DAYS: ${ALBUM_RETENTION_DAYS}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    networks:
      - pixpick

  # The storage, the database and the cache share one disk here, so what
  # this discards is what keeps that disk from filling up.
  reconciler:
    mem_limit: 256m
    restart: unless-stopped
    build:
      context: ./backend
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          python -m src.maintenance.reconcile
          sleep 300
        done
    environment:
      # Only what src/maintenance/reconcile.py's import graph reaches.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_BROWSER_ENDPOINT: ${STORAGE_PUBLIC_URL}
      MINIO_SERVER_ENDPOINT: http://storage:9000
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      ALBUM_RETENTION_DAYS: ${ALBUM_RETENTION_DAYS}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    networks:
      - pixpick

  frontend:
    mem_limit: 128m
    restart: unless-stopped
    build:
      context: ./frontend
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      API_BASE_URL: ${API_BASE_URL}
    networks:
      - pixpick

  # The published port is for native mode and for an S3 client; the browser
  # reaches this through nginx. Declared whether or not STORAGE_PROVIDER
  # names it: that variable decides which provider the application talks
  # to, never which containers run.
  storage:
    mem_limit: 512m
    restart: unless-stopped
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "${MINIO_PORT}:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_ALLOWED_ORIGINS}
      MINIO_BROWSER: "off"
    command: ["server", "/data"]
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # It reads originals from the storage itself: nothing here ever hands it
  # bytes. Declared whether or not IMAGE_PROVIDER names it, like `storage`.
  transformer:
    mem_limit: 512m
    restart: unless-stopped
    image: darthsim/imgproxy:v4.0.14
    environment:
      IMGPROXY_KEY: ${IMAGE_SIGNING_KEY}
      IMGPROXY_SALT: ${IMAGE_SIGNING_SALT}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://storage:9000
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      # A signed address is valid for any object in the storage, not only the
      # ones this project's catalog requests, and each costs real CPU.
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
      IMGPROXY_MAX_SRC_FILE_SIZE: "20971520"
      # A ceiling over the catalog's largest variant
      # (backend/src/images/catalog.py), not a copy of it: an entry that
      # outgrows this fails loudly instead of serving something bigger.
      IMGPROXY_MAX_RESULT_DIMENSION: "2048"
      IMGPROXY_WORKERS_NUMBER: "2"
      IMGPROXY_DOWNLOAD_TIMEOUT: "10"
      # A signature covers the object identity and content type, never the
      # prefix, so this is what keeps a signed address inside albums/.
      IMGPROXY_ALLOWED_SOURCES: s3://${MINIO_BUCKET}/albums/*
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - pixpick

  nginx:
    mem_limit: 128m
    restart: unless-stopped
    build:
      context: ./nginx
    ports:
      - "${NGINX_PORT}:80"
    environment:
      # nginx/entrypoint.sh derives its storage server block's hostname from
      # this. The same value the backend gets as MINIO_BROWSER_ENDPOINT, so
      # the two can never differ.
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
    volumes:
      - nginx-cache:/var/cache/nginx/images
    networks:
      - pixpick

# The same subnet and range as compose.yaml, which nginx/nginx.conf.template
# and backend/src/main.py both hardcode as the only trusted peer for a
# declared client address. `ip_range` is what keeps a connection through
# this file's published port -- it arrives as the gateway, .1 -- outside it.
networks:
  pixpick:
    ipam:
      config:
        - subnet: 172.30.238.0/24
          ip_range: 172.30.238.128/25
          gateway: 172.30.238.1

volumes:
  postgres-data:
  storage-data:
  nginx-cache:
