# The development declaration of the environment: it builds the project's
# own four images (migrate, backend, frontend, nginx) from source instead
# of pulling them, and it publishes to the host the ports a developer
# needs. It is complete on its own and is never combined with another
# file:
#
#   docker compose -f compose.dev.yaml up --build
#
# `--build` after a source change, or the image built earlier serves
# instead. compose.yaml is the other declaration, the one that consumes
# published images; the two describe the same seven services and differ
# only in where each image comes from and which ports are published.
services:
  postgres:
    # Explicit ceiling and restart policy (local-environment spec,
    # task 6.3 in harden-local-profile): the services share one
    # machine, so none of them is left free to take all its memory,
    # and each one says on its own whether it comes back after
    # ending unexpectedly.
    mem_limit: 512m
    restart: unless-stopped
    image: postgres:18.6
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # A single mount at /var/lib/postgresql, not .../data: the postgres 18+
    # image lays out its major-version-specific data directory underneath
    # this path (pg_ctlcluster-style) and refuses to start otherwise.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # Runs once, applies pending migrations, and exits (D6). Its connection
  # string is assembled here from the same Postgres server values instead of
  # being written by hand (D7). Bakes the pinned dbmate version and the
  # project's migrations into its image -- see dbmate/Dockerfile. `up`, not
  # `migrate`: the database the connection string names may not exist yet
  # the first time it is used, and `up` creates it before migrating --
  # a no-op every other time.
  migrate:
    # Explicit ceiling and restart policy (local-environment spec,
    # task 6.3 in harden-local-profile): the services share one
    # machine, so none of them is left free to take all its memory,
    # and each one says on its own whether it comes back after
    # ending unexpectedly.
    mem_limit: 256m
    restart: "no"
    build:
      context: ./dbmate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    # Not --no-dump-schema, and with the repo's own dbmate/ bind-mounted
    # over the image's baked-in copy (harden-local-profile): this profile
    # already assumes the repo is checked out to build from source, so
    # this is where dbmate/schema.sql gets regenerated automatically
    # instead of by a separate manual command (README.md). compose.yaml
    # keeps both the flag and the absence of this mount -- it consumes
    # the published image specifically so a deployment never needs the
    # repo checked out, which a bind mount would defeat.
    command: ["up"]
    volumes:
      - ./dbmate:/db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pixpick

  backend:
    # Explicit ceiling and restart policy (local-environment spec,
    # task 6.3 in harden-local-profile): the services share one
    # machine, so none of them is left free to take all its memory,
    # and each one says on its own whether it comes back after
    # ending unexpectedly.
    mem_limit: 512m
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # STORAGE_PUBLIC_URL, not MINIO_BROWSER_ENDPOINT (object-storage
      # spec, D1 in harden-local-profile's design): the browser now writes
      # through the entry point's own storage hostname, not MinIO's own
      # address, which native mode is the only profile that still uses
      # MINIO_BROWSER_ENDPOINT's bare .env value for.
      MINIO_BROWSER_ENDPOINT: ${STORAGE_PUBLIC_URL}
      # Composed here, never taken from .env: this is the address the
      # services reach each other by inside this network.
      MINIO_SERVER_ENDPOINT: http://storage:9000
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER}
      IMAGE_SIGNING_KEY: ${IMAGE_SIGNING_KEY}
      IMAGE_SIGNING_SALT: ${IMAGE_SIGNING_SALT}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
      ALBUM_MAX_PHOTOS: ${ALBUM_MAX_PHOTOS}
      ACCOUNT_MAX_BYTES: ${ACCOUNT_MAX_BYTES}
      INSTANCE_MAX_BYTES: ${INSTANCE_MAX_BYTES}
      ALBUM_RETENTION_DAYS: ${ALBUM_RETENTION_DAYS}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    networks:
      - pixpick

  # Discards expired uploads and expired albums on a schedule (photo-
  # upload spec, album-retention spec, D6 in harden-local-profile's
  # design): the same command `src/maintenance/reconcile.py`'s own
  # docstring documents as a manual one, invoked here in a loop instead
  # of by someone remembering to run it. The local disk this profile
  # shares between the storage, the database and the cache is what makes
  # what it discards visible as a full disk instead of an unbilled
  # difference (D6) -- the same image as `backend`, since this is the
  # same codebase's own command, not a service of its own.
  reconciler:
    # Explicit ceiling and restart policy (local-environment spec,
    # task 6.3 in harden-local-profile): the services share one
    # machine, so none of them is left free to take all its memory,
    # and each one says on its own whether it comes back after
    # ending unexpectedly.
    mem_limit: 256m
    restart: unless-stopped
    build:
      context: ./backend
    entrypoint: ["sh", "-c"]
    # 300 seconds -- fixed, not configurable: no environment has a
    # legitimate reason to run this cleanup at a different pace.
    command:
      - |
        while true; do
          python -m src.maintenance.reconcile
          sleep 300
        done
    environment:
      # Only what src/maintenance/reconcile.py's own import graph actually
      # reaches (task 8.2): the database, the active storage provider's
      # credentials, and album-retention's own setting -- never identity,
      # images, or the quota/length settings this command never reads.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_BROWSER_ENDPOINT: ${STORAGE_PUBLIC_URL}
      MINIO_SERVER_ENDPOINT: http://storage:9000
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      ALBUM_RETENTION_DAYS: ${ALBUM_RETENTION_DAYS}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    networks:
      - pixpick

  frontend:
    # Explicit ceiling and restart policy (local-environment spec,
    # task 6.3 in harden-local-profile): the services share one
    # machine, so none of them is left free to take all its memory,
    # and each one says on its own whether it comes back after
    # ending unexpectedly.
    mem_limit: 128m
    restart: unless-stopped
    build:
      context: ./frontend
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      API_BASE_URL: ${API_BASE_URL}
    networks:
      - pixpick

  # The object storage. The browser writes to it directly (D3 in
  # add-media-ports-and-local-adapters), so unlike every other service here
  # it is meant to be reached from outside the Docker network too, and this
  # file publishes its port. Declared whether or not STORAGE_PROVIDER names
  # it: which provider the application talks to is decided by that variable,
  # never by which containers are up.
  storage:
    # Explicit ceiling and restart policy (local-environment spec,
    # task 6.3 in harden-local-profile): the services share one
    # machine, so none of them is left free to take all its memory,
    # and each one says on its own whether it comes back after
    # ending unexpectedly.
    mem_limit: 512m
    restart: unless-stopped
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "${MINIO_PORT}:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
      # Declared on the server, not on the bucket: MinIO has no working
      # per-bucket CORS API -- PutBucketCors always answers NotImplemented
      # -- and with a single bucket the two are equally precise anyway
      # (D3, D9 in add-media-ports-and-local-adapters).
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_ALLOWED_ORIGINS}
      # No console UI for this profile to expose (object-storage spec,
      # task 6.1 in harden-local-profile): explicit, not left to whatever
      # a given MinIO version defaults to without --console-address.
      MINIO_BROWSER: "off"
    command: ["server", "/data"]
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - pixpick

  # The image transformer. It reads originals from the storage by itself
  # (D2): nothing in this project ever hands it bytes. It publishes no port
  # -- nginx is the only way to reach it (D5), unlike the storage above.
  # Declared whether or not IMAGE_PROVIDER names it, same as `storage`.
  transformer:
    # Explicit ceiling and restart policy (local-environment spec,
    # task 6.3 in harden-local-profile): the services share one
    # machine, so none of them is left free to take all its memory,
    # and each one says on its own whether it comes back after
    # ending unexpectedly.
    mem_limit: 512m
    restart: unless-stopped
    image: darthsim/imgproxy:v4.0.14
    environment:
      IMGPROXY_KEY: ${IMAGE_SIGNING_KEY}
      IMGPROXY_SALT: ${IMAGE_SIGNING_SALT}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://storage:9000
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      # Explicit ceilings the transformer enforces on its own (image-
      # delivery spec, task 6.2 in harden-local-profile): reaching it is
      # reaching a resource with real CPU and memory cost behind it, and
      # a signed address is valid for any object in the storage, not only
      # the ones this project's own catalog ever requests. Fixed, not
      # configurable: no environment has a legitimate reason for a
      # different ceiling here.
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
      IMGPROXY_MAX_SRC_FILE_SIZE: "20971520"
      # 2048 -- the catalog's own largest variant (backend/src/images/
      # catalog.py, Variant.VIEWER): a hard ceiling on top of it, not a
      # duplicate of it, so a future catalog entry that forgets to stay
      # under it fails loudly instead of quietly serving something bigger.
      IMGPROXY_MAX_RESULT_DIMENSION: "2048"
      IMGPROXY_WORKERS_NUMBER: "2"
      IMGPROXY_DOWNLOAD_TIMEOUT: "10"
      # Read access limited to the albums prefix (object-storage spec):
      # a signature covers only the object identity and the content
      # type, never which prefix it lives under, so this is the one
      # place that keeps a filtered signature from reaching the rest of
      # the bucket.
      IMGPROXY_ALLOWED_SOURCES: s3://${MINIO_BUCKET}/albums/*
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - pixpick

  # The single door to the host: routes to the backend, the transformer, and
  # the frontend. The only service here whose published port the application
  # is opened on.
  nginx:
    # Explicit ceiling and restart policy (local-environment spec,
    # task 6.3 in harden-local-profile): the services share one
    # machine, so none of them is left free to take all its memory,
    # and each one says on its own whether it comes back after
    # ending unexpectedly.
    mem_limit: 128m
    restart: unless-stopped
    build:
      context: ./nginx
    ports:
      - "${NGINX_PORT}:80"
    environment:
      # Where its own storage server block matches an incoming Host
      # (nginx/entrypoint.sh derives the bare hostname from this; object-
      # storage spec, D1). The same value the backend receives as
      # MINIO_BROWSER_ENDPOINT above, so the two always name the same
      # hostname.
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
    volumes:
      # The images cache (D12 in add-media-ports-and-local-adapters): a
      # volume, not an anonymous layer, so it survives a container
      # restart instead of re-warming from nothing every time.
      - nginx-cache:/var/cache/nginx/images
    networks:
      - pixpick

# Fixed to the same subnet and container range as compose.yaml's own
# (request-throttling spec, D4): nginx/nginx.conf and backend/src/main.py
# hardcode the container range as the only trusted peer for a declared
# client address, and `ip_range` is what keeps a connection arriving
# through this file's own published port -- which shows up as the
# gateway address, .1 -- from falling inside it (task 2.3).
networks:
  pixpick:
    ipam:
      config:
        - subnet: 172.30.238.0/24
          ip_range: 172.30.238.128/25
          gateway: 172.30.238.1

volumes:
  postgres-data:
  storage-data:
  nginx-cache:
