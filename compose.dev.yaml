services:
  edge:
    ports:
      - "${EDGE_PORT}:80"

  # Published only so a database client on the host can inspect it (D7);
  # nothing in this change connects to it yet.
  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"

  # Source mounted over the image's copy, and --reload instead of the
  # Dockerfile's plain command, so editing backend code doesn't require
  # rebuilding the image. See backend/Dockerfile for why this is uvicorn
  # directly instead of `fastapi dev`.
  backend:
    volumes:
      - ./backend/src:/app/src
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--loop", "src.loop:loop_factory"]
