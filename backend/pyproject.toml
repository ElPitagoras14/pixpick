[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the scaffold-base template (Python + uv, SQLAlchemy/psycopg, Pydantic Settings)."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "ElPitagoras14" },
]
license = "MIT"
keywords = ["fastapi", "template", "scaffold", "backend", "sqlalchemy", "uv"]
dependencies = [
    "bcrypt>=5.0.0",
    "boto3>=1.43.93",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
]

[project.urls]
Repository = "https://github.com/ElPitagoras14/scaffold-base"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    # Only the compose convention check reads it. Declared rather than
    # taken for granted: it already arrives through fastapi[standard],
    # and a test resting on a dependency nobody asked for breaks the day
    # that graph changes, with nothing to announce it.
    "pyyaml>=6.0.3",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# Half of the import convention (code-conventions spec): a relative import
# never climbs to a parent package. The other half — a module inside the
# file's own subtree is imported relatively — has no lint rule and is
# covered by tests/test_code_conventions.py.
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `Depends(...)`, `Cookie(...)`, and
# friends as parameter defaults are how a route declares what it needs
# (session-management spec), not a mutable-default bug (B008).
extend-immutable-calls = [
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Query",
]
