server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Hashed filenames identify their content: cache long, immutably
	# (frontend-delivery spec).
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# The entry document and the runtime config must always be revalidated
	# so a new deploy is visible on a plain reload, and so a restarted
	# container's substituted config is never served stale from cache.
	location = /index.html {
		add_header Cache-Control "no-cache" always;
		try_files $uri =404;
	}

	location = /config.js {
		add_header Cache-Control "no-cache" always;
		try_files $uri =404;
	}

	# Client-side routing: any other path that isn't a real file falls back
	# to the app shell, which resolves its own view or its own not-found
	# screen. The API space never reaches this file -- the edge routes it
	# straight to the backend and has no fallback of its own (D1, D3).
	location / {
		try_files $uri /index.html;
	}
}
